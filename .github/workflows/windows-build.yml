name: Build Flutter Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_ml   # 👈 ده أهم تعديل

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Compress Release folder into zip
        run: |
          cd build/windows/runner/Release
          powershell Compress-Archive -Path * -DestinationPath ../../../app-release.zip

      - name: Upload exe artifact (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows-exe
          path: flutter_ml/build/app-release.zip
